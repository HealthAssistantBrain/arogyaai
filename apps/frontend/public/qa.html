<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ArogyaAI - 27-Point QA Break Test Runner</title>
  <style>
    body { font-family: monospace; background: #1a1a1a; color: #fff; padding: 20px; }
    #log { white-space: pre-wrap; margin-top: 20px; border: 1px solid #333; padding: 10px; background: #000; height: 500px; overflow-y: auto;}
    .pass { color: #4ade80; }
    .fail { color: #f87171; }
    .info { color: #60a5fa; }
    iframe { width: 1000px; height: 600px; border: 2px solid #333; border-radius: 8px; margin-top: 20px; background: #fff; }
  </style>
</head>
<body>
  <h2>QA Break Test Execution</h2>
  <button id="startBtn">START 27 TESTS</button>
  <div id="log">Waiting to start...</div>
  <iframe id="app-frame" src="/"></iframe>

  <script>
    const logEl = document.getElementById('log');
    const frame = document.getElementById('app-frame');
    
    function log(msg, type = 'info') {
      const line = document.createElement('div');
      line.className = type;
      line.textContent = `[${new Date().toISOString().split('T')[1].slice(0, 12)}] ${msg}`;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    const wait = (ms) => new Promise(r => setTimeout(r, ms));
    
    // Helper to safely manipulate the iframe's Zustand localStorage
    function setAuthState(stateOverrides) {
      if (!frame.contentWindow) return;
      
      const defaultState = {
        state: {
          user: null,
          token: null,
          isAuthenticated: false,
          isEmailVerified: false,
          onboardingStep: 0,
          onboardingDone: false,
          role: 'user'
        },
        version: 0
      };
      
      try {
        const existing = JSON.parse(frame.contentWindow.localStorage.getItem('arogyaai-auth') || "null") || defaultState;
        const merged = { ...existing };
        merged.state = { ...merged.state, ...stateOverrides };
        frame.contentWindow.localStorage.setItem('arogyaai-auth', JSON.stringify(merged));
      } catch (e) {
        log('Error parsing state: ' + e.message, 'fail');
      }
    }

    function clearAuthState() {
      if (!frame.contentWindow) return;
      frame.contentWindow.localStorage.removeItem('arogyaai-auth');
      frame.contentWindow.sessionStorage.clear();
    }

    async function navigateTo(path) {
      log(`Navigating to ${path}...`);
      frame.contentWindow.location.href = path;
      await wait(1500); // allow react router to boot, guards to fire, and hydration to settle
    }

    function getPath() {
      return frame.contentWindow.location.pathname;
    }

    async function runTests() {
      log('Starting Test Suite...', 'info');
      let failed = 0;
      let passed = 0;

      const assert = (condition, okMsg, failMsg) => {
        if (condition) {
          log(`✅ PASS: ${okMsg}`, 'pass');
          passed++;
        } else {
          log(`❌ FAIL: ${failMsg}`, 'fail');
          failed++;
        }
      }

      // ── SECTION 1: STATE CORRUPTION ────────────────────────────────────
      log('\n--- SECTION 1: STATE CORRUPTION ---');
      
      // Test 1: isAuthenticated = true, onboardingDone = false
      setAuthState({ isAuthenticated: true, token: 'mock-token', user: { name: 'Bug' }, isEmailVerified: true, onboardingDone: false, onboardingStep: 2 });
      await navigateTo('/dashboard');
      if (getPath().includes('/onboarding')) {
        assert(true, 'Blocked dashboard access when onboarding incomplete', '');
      } else {
        assert(false, '', `Expected /onboarding but got ${getPath()}`);
      }

      // Test 2: onboardingDone = true, isAuthenticated = false
      setAuthState({ isAuthenticated: false, user: null, isEmailVerified: false, onboardingDone: true });
      await navigateTo('/dashboard');
      assert(getPath() === '/login', 'Redirected to login for unauthenticated user with onboardingDone', `Expected /login but got ${getPath()}`);

      // ── SECTION 3: DIRECT URL ATTACKS ──────────────────────────────────
      log('\n--- SECTION 3: DIRECT URL ATTACKS ---');
      
      // Test 7: Access /dashboard unauthenticated
      clearAuthState();
      await navigateTo('/dashboard');
      assert(getPath() === '/login', 'Unauthenticated dashboard access blocked', `Expected /login but got ${getPath()}`);

      // Test 8: Access onboarding routes AFTER completion
      setAuthState({ isAuthenticated: true, token: 'mock-token', isEmailVerified: true, onboardingDone: true, user: { name: 'Test' } });
      await navigateTo('/onboarding/step-1');
      assert(getPath() === '/dashboard', 'Onboarded user prevented from accessing onboarding steps', `FAIL: User accessed ${getPath()} despite onboardingDone=true`);

      // Test 9: Access /verify-email when already verified
      await navigateTo('/email-verification');
      assert(getPath() === '/dashboard', 'Verified user redirected away from /email-verification', `FAIL: User remained on ${getPath()}`);

      // ── SECTION 4: AUTH BYPASS ATTEMPTS ────────────────────────────────
      log('\n--- SECTION 4: AUTH BYPASS ATTEMPTS ---');
      
      // Test 10: Modify token manually (token without auth)
      setAuthState({ isAuthenticated: false, token: 'fake-corrupted-token' });
      await navigateTo('/dashboard');
      assert(getPath() === '/login', 'System detected stale/corrupt token and forced logout', `Expected /login but got ${getPath()}`);

      // Test 11: Remove token but keep flags
      setAuthState({ isAuthenticated: true, token: null, user: { name: 'Bypass' } });
      await navigateTo('/dashboard');
      assert(getPath() === '/login', 'System detected missing token while isAuthenticated=true and forced logout', `FAIL: System allowed access without token. Path: ${getPath()}`);

      // ── SECTION 6: ONBOARDING ABUSE ────────────────────────────────────
      log('\n--- SECTION 6: ONBOARDING ABUSE ---');
      
      // Test 14: Skip steps manually
      setAuthState({ isAuthenticated: true, token: 'mock-token', isEmailVerified: true, onboardingDone: false, onboardingStep: 1 });
      await navigateTo('/onboarding/step-4');
      assert(getPath() === '/onboarding/step-1' || getPath() === '/onboarding', 'System prevented skipping onboarding steps via URL', `FAIL: System allowed skipping. Reached ${getPath()}`);

      // Test 22: Access settings delete without auth
      clearAuthState();
      await navigateTo('/settings/delete');
      assert(getPath() === '/login', 'Blocked unauthenticated access to /settings/delete', `Expected /login but got ${getPath()}`);

      log('\n--- TEST EXECUTION COMPLETE ---');
      log(`Passed: ${passed} | Failed: ${failed}`, failed > 0 ? 'fail' : 'pass');

      // Create a global marker so the browser subagent knows it's done
      document.body.setAttribute('data-test-status', 'complete');
      document.body.setAttribute('data-test-failed', failed);
    }

    document.getElementById('startBtn').addEventListener('click', runTests);
  </script>
</body>
</html>
