services:
  frontend:
    build: 
      context: ./apps/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_GOOGLE_FIT_DEFAULT_TIMEZONE=Asia/Kolkata
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
    networks:
      - arogyaai_net

  backend:
    build:
      context: ./
      dockerfile: apps/backend/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,backend,postgres,redis,qdrant,prediction-service,rag-service,wearable-service}
        CUSTOM_CA_CERT_B64: ${CUSTOM_CA_CERT_B64:-}
    ports:
      - "8000:8000"
    env_file:
      - ./apps/backend/.env
    environment:
      - RUN_MIGRATIONS=true
    networks:
      - arogyaai_net
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  celery-worker:
    build:
      context: ./
      dockerfile: apps/backend/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,backend,postgres,redis,qdrant,prediction-service,rag-service,wearable-service}
        CUSTOM_CA_CERT_B64: ${CUSTOM_CA_CERT_B64:-}
    command: ["celery", "-A", "pipelines.orchestration_pipeline.celery_app:celery_app", "worker", "--loglevel=INFO", "-Q", "ingestion,feature,ml,shap"]
    env_file:
      - ./apps/backend/.env
    environment:
      - RUN_MIGRATIONS=false
    networks:
      - arogyaai_net
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  prediction-service:
    build:
      context: ./pipelines/prediction-service
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,backend,postgres,redis,qdrant,prediction-service,rag-service,wearable-service}
        CUSTOM_CA_CERT_B64: ${CUSTOM_CA_CERT_B64:-}
    container_name: prediction-service
    ports:
      - "8001:8000"
    env_file:
      - .env
    networks:
      - arogyaai_net

  rag-service:
    build:
      context: ./pipelines/rag-service
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,backend,postgres,redis,qdrant,prediction-service,rag-service,wearable-service}
        CUSTOM_CA_CERT_B64: ${CUSTOM_CA_CERT_B64:-}
    container_name: rag-service
    ports:
      - "8002:8000"
    env_file:
      - .env
    networks:
      - arogyaai_net

  wearable-service:
    build:
      context: ./pipelines/wearable-service
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,backend,postgres,redis,qdrant,prediction-service,rag-service,wearable-service}
        CUSTOM_CA_CERT_B64: ${CUSTOM_CA_CERT_B64:-}
    container_name: wearable-service
    ports:
      - "8003:8000"
    env_file:
      - .env
    networks:
      - arogyaai_net

  postgres:
    image: timescale/timescaledb:latest-pg15
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-arogyaai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - arogyaai_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-arogyaai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      

  pgadmin:
    image: dpage/pgadmin4:latest
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@arogyaai.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - arogyaai_net
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - arogyaai_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - arogyaai_net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - arogyaai_net

networks:
  arogyaai_net:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  qdrant_data:
