services:
  frontend:
    build: 
      context: ./apps/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    networks:
      - arogyaai_net

  backend:
    build: ./apps/backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - arogyaai_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  prediction-service:
    build: ./pipelines/prediction-service
    container_name: prediction-service
    ports:
      - "8001:8000"
    env_file:
      - .env
    networks:
      - arogyaai_net

  rag-service:
    build: ./pipelines/rag-service
    container_name: rag-service
    ports:
      - "8002:8000"
    env_file:
      - .env
    networks:
      - arogyaai_net

  wearable-service:
    build: ./pipelines/wearable-service
    container_name: wearable-service
    ports:
      - "8003:8000"
    env_file:
      - .env
    networks:
      - arogyaai_net

  postgres:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-arogyaai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - arogyaai_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-arogyaai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      

  pgadmin:
    image: dpage/pgadmin4:latest
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@arogyaai.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - arogyaai_net
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - arogyaai_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - arogyaai_net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - arogyaai_net

networks:
  arogyaai_net:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  qdrant_data:


