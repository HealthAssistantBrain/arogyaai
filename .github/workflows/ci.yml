name: ArogyaAI CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Secrets should be configured in GitHub repository settings.
  # Fallback values are safe dummy values for CI only.
  POSTGRES_USER: user
  POSTGRES_PASSWORD: password
  POSTGRES_DB: arogyaai
  SECRET_KEY: ci-secret-key-not-for-production
  ALGORITHM: HS256
  REDIS_URL: redis://localhost:6379/0
  DATABASE_URL: postgresql+psycopg2://user:password@localhost:5432/arogyaai
  VITE_API_URL: http://localhost:8000

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 1 + 2 — Install & Lint/Validate (fast feedback, no Docker needed)
  # ─────────────────────────────────────────────────────────────────────────────
  validate:
    name: "Stage 1+2 — Install & Validate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Python setup ────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install backend dependencies
        run: |
          pip install -r apps/backend/requirements.txt

      - name: Syntax check — backend
        run: |
          python -m py_compile apps/backend/main.py
          echo "✅ Backend syntax OK"

      # ── Node setup ──────────────────────────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Frontend build check
        working-directory: apps/frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}

  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 3 + 4 + 5 — Docker build, health check, cleanup
  # ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: "Stage 3-5 — Docker Build & Health Check"
    runs-on: ubuntu-latest
    needs: validate # only run if validate passes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Write a minimal .env so docker-compose can resolve variables
      - name: Create CI .env
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=user
          POSTGRES_PASSWORD=password
          POSTGRES_DB=arogyaai
          SECRET_KEY=ci-secret-key-not-for-production
          ALGORITHM=HS256
          REDIS_URL=redis://redis:6379/0
          DATABASE_URL=postgresql+psycopg2://user:password@postgres:5432/arogyaai
          VITE_API_URL=http://localhost:8000
          PGADMIN_DEFAULT_EMAIL=admin@arogyaai.com
          PGADMIN_DEFAULT_PASSWORD=admin
          EOF

      # ── STAGE 3: Docker Build ───────────────────────────────────────────────
      - name: Stage 3 — Build all services
        run: |
          docker compose build \
            backend \
            frontend \
            prediction-service \
            rag-service
        # Build in parallel; fail on first error
        env:
          COMPOSE_PARALLEL_LIMIT: 6
          DOCKER_BUILDKIT: 1

      # ── STAGE 4: Start & Health Check ──────────────────────────────────────
      - name: Stage 4 — Start core services
        shell: bash
        run: |
          set -euo pipefail

          wait_for_health() {
            local service="$1"
            local attempts="${2:-30}"
            local delay="${3:-2}"

            for i in $(seq 1 "$attempts"); do
              local container_id
              container_id="$(docker compose ps -q "$service" || true)"
              if [ -n "$container_id" ]; then
                local status
                status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id" 2>/dev/null || true)"
                if [ "$status" = "healthy" ] || [ "$status" = "running" ]; then
                  echo "$service is $status"
                  return 0
                fi
                if [ "$status" = "unhealthy" ]; then
                  echo "❌ $service became unhealthy"
                  docker compose logs "$service" --tail=200 || true
                  return 1
                fi
                if [ "$status" = "exited" ] || [ "$status" = "dead" ]; then
                  echo "❌ $service stopped unexpectedly"
                  docker compose logs "$service" --tail=200 || true
                  return 1
                fi
              fi

              echo "Waiting for $service... ($i/$attempts)"
              sleep "$delay"
            done

            echo "❌ Timed out waiting for $service"
            docker compose logs "$service" --tail=200 || true
            return 1
          }

          # Start infrastructure first (postgres, redis)
          docker compose up -d postgres redis
          echo "⏳ Waiting for postgres and redis to be healthy..."
          wait_for_health postgres 30 2
          wait_for_health redis 30 2

          # Start backend after infra is healthy; the container entrypoint handles
          # DB readiness, migrations, and then launches Uvicorn.
          docker compose up -d backend
          echo "⏳ Waiting for backend to be ready..."
          backend_ready=false
          for i in $(seq 1 60); do
            backend_container_id="$(docker compose ps -q backend || true)"
            if [ -n "$backend_container_id" ]; then
              backend_health_status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$backend_container_id" 2>/dev/null || true)"
              backend_status="$(docker inspect --format='{{.State.Status}}' "$backend_container_id" 2>/dev/null || true)"
              if [ "$backend_health_status" = "unhealthy" ]; then
                echo "❌ Backend container became unhealthy"
                docker compose logs backend --tail=200 || true
                exit 1
              fi
              if [ "$backend_status" = "exited" ] || [ "$backend_status" = "dead" ]; then
                echo "❌ Backend container stopped before becoming healthy"
                docker compose logs backend --tail=200 || true
                exit 1
              fi
            fi

            if curl -fsS http://localhost:8000/health; then
              backend_ready=true
              break
            fi

            echo "Waiting for backend... ($i/60)"
            sleep 3
          done

          if [ "$backend_ready" != "true" ]; then
            echo "❌ Backend did not become ready in time"
            docker compose logs backend --tail=200 || true
            exit 1
          fi

      - name: Stage 4 — Health check validation
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
          BODY=$(curl -s http://localhost:8000/health)
          echo "Status: $RESPONSE"
          echo "Body:   $BODY"
          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Health check failed — HTTP $RESPONSE"
            docker compose logs backend --tail=50
            exit 1
          fi
          echo "✅ Health check passed"

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail=200 backend postgres redis || true

      # ── STAGE 5: Cleanup ────────────────────────────────────────────────────
      - name: Stage 5 — Cleanup
        if: always() # run even if previous steps fail
        run: docker compose down -v --remove-orphans
