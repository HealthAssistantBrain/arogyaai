name: ArogyaAI CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write
  actions: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      backend: ${{ steps.detect.outputs.backend }}
      ai_runtime: ${{ steps.detect.outputs.ai_runtime }}
      infra: ${{ steps.detect.outputs.infra }}
      security: ${{ steps.detect.outputs.security }}
      docs: ${{ steps.detect.outputs.docs }}
      ci: ${{ steps.detect.outputs.ci }}
      code: ${{ steps.detect.outputs.code }}
      all: ${{ steps.detect.outputs.all }}
      changed_files: ${{ steps.detect.outputs.changed_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: detect
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python .github/scripts/detect_changes.py

      - name: CI summary
        run: |
          {
            echo "## [CI] Changed Area Detection"
            echo ""
            echo "| Area | Run |"
            echo "|---|---|"
            echo "| Frontend | ${{ steps.detect.outputs.frontend }} |"
            echo "| Backend | ${{ steps.detect.outputs.backend }} |"
            echo "| AI runtime | ${{ steps.detect.outputs.ai_runtime }} |"
            echo "| Docker/infra | ${{ steps.detect.outputs.infra }} |"
            echo "| Security/env | ${{ steps.detect.outputs.security }} |"
            echo "| CI | ${{ steps.detect.outputs.ci }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  lint-and-format:
    name: Lint and Format
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.ci == 'true'
    uses: ./.github/workflows/lint-and-format.yml
    secrets: inherit
    with:
      changed_files: ${{ needs.detect-changes.outputs.changed_files }}

  frontend-tests:
    name: Frontend Validation
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.ci == 'true'
    uses: ./.github/workflows/frontend-tests.yml
    secrets: inherit

  backend-tests:
    name: Backend Validation
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.ai_runtime == 'true' || needs.detect-changes.outputs.ci == 'true'
    uses: ./.github/workflows/backend-tests.yml
    secrets: inherit

  ai-runtime-validation:
    name: AI Runtime Validation
    needs: detect-changes
    if: needs.detect-changes.outputs.ai_runtime == 'true' || needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.ci == 'true'
    uses: ./.github/workflows/ai-runtime-validation.yml
    secrets: inherit

  docker-validation:
    name: Docker Validation
    needs: detect-changes
    if: needs.detect-changes.outputs.infra == 'true' || needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.ci == 'true'
    uses: ./.github/workflows/docker-validation.yml
    secrets: inherit

  security-scan:
    name: Security Scan
    needs: detect-changes
    if: needs.detect-changes.outputs.security == 'true' || needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.ci == 'true'
    uses: ./.github/workflows/security-scan.yml
    secrets: inherit

  performance-check:
    name: Performance Check
    needs: [detect-changes, frontend-tests, backend-tests]
    if: always() && (needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.ai_runtime == 'true' || needs.detect-changes.outputs.ci == 'true')
    uses: ./.github/workflows/performance-check.yml
    secrets: inherit

  deployment-readiness:
    name: Deployment Readiness
    needs:
      - detect-changes
      - lint-and-format
      - frontend-tests
      - backend-tests
      - ai-runtime-validation
      - docker-validation
      - security-scan
      - performance-check
    if: always()
    uses: ./.github/workflows/deployment-readiness.yml
    secrets: inherit
    with:
      require_secrets: false
      lint_result: ${{ needs.lint-and-format.result }}
      frontend_result: ${{ needs.frontend-tests.result }}
      backend_result: ${{ needs.backend-tests.result }}
      ai_result: ${{ needs.ai-runtime-validation.result }}
      docker_result: ${{ needs.docker-validation.result }}
      security_result: ${{ needs.security-scan.result }}
      performance_result: ${{ needs.performance-check.result }}
