name: Release Pipeline

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to package, for example v1.2.3
        required: true
        type: string

permissions:
  contents: write
  packages: write
  checks: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  readiness:
    name: Production Readiness Gate
    uses: ./.github/workflows/deployment-readiness.yml
    secrets: inherit
    with:
      require_secrets: true

  package:
    name: Release Artifacts and Docker Images
    needs: readiness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve semantic version
        id: version
        run: |
          version="${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release version must be semantic and start with v, got: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "[DEPLOYMENT] release_version=$version"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata backend
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backend
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Docker metadata frontend
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          file: apps/frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Generate changelog
        run: |
          echo "::group::[DEPLOYMENT] Changelog"
          previous_tag="$(git describe --tags --abbrev=0 "${{ steps.version.outputs.version }}^" 2>/dev/null || true)"
          {
            echo "# ArogyaAI ${{ steps.version.outputs.version }}"
            echo ""
            echo "Generated from commit $GITHUB_SHA."
            echo ""
            if [[ -n "$previous_tag" ]]; then
              echo "## Changes since $previous_tag"
              git log --pretty=format:"- %s (%h)" "$previous_tag"..HEAD
            else
              echo "## Changes"
              git log --pretty=format:"- %s (%h)" -50
            fi
          } > CHANGELOG_RELEASE.md
          cat CHANGELOG_RELEASE.md
          echo "::endgroup::"

      - name: Build deployment package
        run: |
          echo "::group::[DEPLOYMENT] Deployment package"
          mkdir -p release-package
          cp docker-compose.yml release-package/
          cp -R .github/env release-package/env-templates
          cp CHANGELOG_RELEASE.md release-package/
          tar -czf "arogyaai-${{ steps.version.outputs.version }}-deployment.tar.gz" release-package
          tar -tzf "arogyaai-${{ steps.version.outputs.version }}-deployment.tar.gz"
          echo "::endgroup::"

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: arogyaai-${{ steps.version.outputs.version }}-deployment
          path: |
            CHANGELOG_RELEASE.md
            arogyaai-${{ steps.version.outputs.version }}-deployment.tar.gz
          retention-days: 30

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ArogyaAI ${{ steps.version.outputs.version }}
          body_path: CHANGELOG_RELEASE.md
          files: arogyaai-${{ steps.version.outputs.version }}-deployment.tar.gz
          generate_release_notes: true

      - name: Job summary
        if: always()
        run: |
          {
            echo "## [DEPLOYMENT] Release Summary"
            echo ""
            echo "- Version: ${{ steps.version.outputs.version }}"
            echo "- Backend image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backend:${{ steps.version.outputs.version }}"
            echo "- Frontend image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend:${{ steps.version.outputs.version }}"
            echo "- Deployment package: uploaded"
            echo "- Changelog: generated"
          } >> "$GITHUB_STEP_SUMMARY"
